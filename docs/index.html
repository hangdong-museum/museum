<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>박물관 보물찾기</title>
<script src="config.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    --bg:#0d111a; --panel:#151b28; --card:#1a2030; --line:#2a3245;
    --text:#e8e9ee; --sub:#9aa2b5; --gold:#c9a25c; --gold2:#a87b3c;
    --ok:#4fbf8a; --err:#e06464;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
       background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
  h1{font-family:'Nanum Myeongjo',serif;font-weight:800}
  button{font-family:inherit;cursor:pointer;border:none}
  input{font-family:inherit}

  /* 로그인 */
  #login{display:flex;flex-direction:column;justify-content:center;min-height:90vh}
  .title{text-align:center;margin-bottom:28px}
  .title .gem{font-size:40px}
  .title h1{font-size:26px;margin-top:8px}
  .title p{color:var(--sub);margin-top:6px;font-size:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
  .inp{width:100%;background:#0a0e16;border:1px solid var(--line);border-radius:12px;
       color:var(--text);padding:14px;font-size:16px;outline:none}
  .inp:focus{border-color:var(--gold)}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1408;
            font-weight:700;border-radius:12px;padding:14px;font-size:16px;
            box-shadow:0 4px 14px rgba(201,162,92,.25)}
  .btn-gold:disabled{opacity:.45}
  .msg{min-height:20px;margin-top:10px;font-size:14px;text-align:center}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}

  /* 메인 */
  #main{display:none}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .top .who{font-size:14px;color:var(--sub)}
  .top .who b{color:var(--text);font-size:16px}
  .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--sub);
             border-radius:10px;padding:7px 12px;font-size:13px}
  .progress{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .progress .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .progress .row b{font-size:22px;color:var(--gold)}
  .bar{height:8px;background:#0a0e16;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .4s}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
         text-align:left;color:var(--text);padding:0;position:relative}
  .tcard.done{border-color:var(--gold)}
  .tcard .img{height:130px;background:#0a0e16;display:flex;align-items:center;justify-content:center}
  .tcard .img img{max-width:100%;max-height:120px;object-fit:contain}
  .tcard .info{padding:10px 12px 12px}
  .tcard .name{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:16px}
  .tcard .loc{font-size:11.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{display:flex;gap:5px;margin-top:8px}
  .chip{font-size:11px;padding:3px 7px;border-radius:99px;background:#0a0e16;color:var(--sub);border:1px solid var(--line)}
  .chip.on{background:rgba(79,191,138,.12);color:var(--ok);border-color:rgba(79,191,138,.4)}
  .stamp{position:absolute;top:8px;right:8px;background:var(--gold);color:#1b1408;font-weight:800;
         font-size:11px;padding:4px 8px;border-radius:99px;display:none}
  .tcard.done .stamp{display:block}

  /* 모달 */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;overflow-y:auto;z-index:10;padding:12px}
  .sheet{max-width:540px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .sheet-head h1{font-size:22px}
  .hero{background:#0a0e16;border:1px solid var(--line);border-radius:14px;height:270px;
        display:flex;align-items:center;justify-content:center;padding:10px}
  .hero img{max-width:100%;max-height:250px;object-fit:contain;border-radius:8px}
  .locbox{margin-top:12px;background:#2a2518;border:1px solid #6b5630;border-radius:12px;padding:11px 14px;font-size:14px}
  .locbox span{color:var(--gold);font-weight:700;margin-right:8px;font-size:13px}
  .hint{display:flex;gap:10px;align-items:flex-start;margin-top:10px;background:var(--card);
        border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55}
  .hint .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);
           font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  hr.sep{border:none;border-top:1px solid var(--line);margin:20px 0}
  .q{font-weight:700;font-size:15px;margin-bottom:10px}
  .ansrow{display:flex;gap:8px}
  .ansrow .inp{flex:1}
  .ansrow .btn-gold{flex:none;padding:0 20px}
  .solved{background:rgba(79,191,138,.1);border:1px solid rgba(79,191,138,.4);color:var(--ok);
          border-radius:12px;padding:13px;text-align:center;font-weight:700}
  .drop{border:1.5px dashed var(--line);border-radius:14px;min-height:110px;display:flex;align-items:center;
        justify-content:center;color:var(--sub);font-size:14px;text-align:center;padding:12px;margin-bottom:12px}
  .drop img{max-width:100%;max-height:320px;border-radius:10px}
  .drop.locked{opacity:.6}
  .btn-full{width:100%}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.25);border-top-color:#1b1408;
           border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .chip.wait{background:rgba(224,179,79,.12);color:#e0b34f;border-color:rgba(224,179,79,.4)}
  .pend{display:none;background:#2a2518;border:1px solid #6b5630;border-radius:16px;padding:14px;margin-bottom:16px}
  .pend .t{font-size:14px;margin-bottom:10px}
  .pend .t b{color:var(--gold);font-size:17px}
  .pend .w{color:#e0b34f;font-size:12.5px;margin-top:8px;min-height:0}
  .pendNote{margin-top:8px;font-size:13px;color:#e0b34f}
  .drop{flex-direction:column}
  .btn-sub{margin-top:8px;background:var(--card);border:1px solid var(--gold);color:var(--gold);font-weight:700;
           border-radius:12px;padding:12px;font-size:15px;width:100%;display:none}
  .btn-sub:disabled{opacity:.45}
  #dlg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
  #dlg .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 20px 18px;max-width:340px;width:100%;text-align:center}
  #dlg .ic{font-size:34px}
  #dlg h3{font-size:18px;margin:8px 0 10px}
  #dlg p{color:var(--sub);font-size:14px;line-height:1.6}
  #dlg .size{margin-top:10px;font-size:14px}
  #dlg .size b{color:var(--gold)}
  #dlg .warn{margin-top:10px;color:#e0b34f;font-size:13.5px;font-weight:700}
  #dlg .btns{display:flex;gap:8px;margin-top:18px}
  #dlg .btns button{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:700}
  #dlg .no{background:var(--card);border:1px solid var(--line);color:var(--text)}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222a3b;border:1px solid var(--line);
         padding:11px 18px;border-radius:12px;font-size:14px;display:none;z-index:20;max-width:90%}
</style>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">

  <!-- 로그인 -->
  <div id="login">
    <div class="title">
      <div class="gem">💎</div>
      <h1>박물관 보물찾기</h1>
      <p>국립중앙박물관 · 보물을 찾아 인증 사진을 남겨요</p>
    </div>
    <div class="field"><label>학번</label><input id="sid" class="inp" inputmode="numeric" autocomplete="off" placeholder="예) 30101"></div>
    <div class="field"><label>이름</label><input id="sname" class="inp" autocomplete="off" placeholder="이름"></div>
    <div class="field"><label>입장 코드</label><input id="scode" class="inp" autocomplete="off" placeholder="선생님이 알려준 코드"></div>
    <button id="btnLogin" class="btn-gold btn-full" onclick="doLogin()">입장하기</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- 메인 -->
  <div id="main">
    <div class="top">
      <div class="who"><b id="whoName"></b> <span id="whoSid"></span></div>
      <button class="btn-ghost" onclick="logout()">로그아웃</button>
    </div>
    <div class="progress">
      <div class="row"><span>찾은 보물</span><span><b id="doneCnt">0</b> / <span id="totalCnt">0</span></span></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <div id="pendBar" class="pend">
      <div class="t">📦 올리지 않은 사진 <b id="pendCnt">0</b>장</div>
      <button id="btnUpAll" class="btn-gold btn-full" onclick="uploadAll()">📶 와이파이 연결 후 모두 올리기</button>
      <div id="pendWarn" class="w"></div>
    </div>
    <div id="grid" class="grid"></div>
  </div>
</div>

<!-- 보물 상세 -->
<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="sheet-head">
      <h1>💎 보물 <span id="mNo"></span></h1>
      <button class="btn-ghost" onclick="closeModal()">✕ 닫기</button>
    </div>
    <div class="hero"><img id="mImg" alt=""></div>
    <div class="locbox"><span>📍 위치</span><b id="mLoc"></b></div>
    <div id="mHints"></div>

    <hr class="sep">
    <div class="q">① <span id="mQ"></span></div>
    <div id="ansArea"></div>
    <div id="ansMsg" class="msg"></div>

    <hr class="sep">
    <div class="q">② 인증 사진</div>
    <div id="drop" class="drop"></div>
    <input id="file" type="file" accept="image/*" style="display:none" onchange="onFile(this)">
    <button id="btnUpload" class="btn-gold btn-full" onclick="pickFile()">📷 사진 찍기 / 고르기</button>
    <button id="btnNow" class="btn-sub" onclick="uploadNow()">⬆️ 이 사진 지금 올리기</button>
    <div id="upMsg" class="msg"></div>
  </div>
</div>

<div id="dlg">
  <div class="box">
    <div class="ic">📶</div>
    <h3>와이파이에 연결되어 있나요?</h3>
    <p>모바일 데이터로 올리면 데이터가 사용돼요.<br>와이파이에 연결한 뒤 올려 주세요.</p>
    <div class="size" id="dlgSize"></div>
    <div class="warn" id="dlgWarn"></div>
    <div class="btns">
      <button class="no" id="dlgNo">취소</button>
      <button class="btn-gold" id="dlgYes">올리기</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let U = null;          // {sid,name,code}
  let T = [];            // treasures
  let S = {};            // 서버 상태
  let P = {};            // 기기에 저장된(업로드 대기) 사진 {no: {data, thumb, savedAt}}
  let cur = null;        // 현재 보물 번호
  let uploading = false;
  let idbOK = true;
  const imgCache = {};

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function call(fn, ...args){
    if(!window.API_URL || /여기에/.test(window.API_URL)) throw new Error('config.js에 API 주소를 넣어 주세요.');
    let r;
    try{
      r = await fetch(window.API_URL, { method: 'POST', body: JSON.stringify({ fn, args }) });
    }catch(e){ throw new Error('인터넷 연결을 확인해 주세요.'); }
    let j;
    try{ j = await r.json(); }catch(e){ throw new Error('서버 응답을 읽지 못했어요. 잠시 후 다시 시도해 주세요.'); }
    if(!j.ok) throw new Error(j.error || '오류가 발생했어요.');
    return j.data;
  }
  function errText(e){ return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/,''); }
  function toast(t){ const el=$('toast'); el.textContent=t; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2400); }
  function store(k, v){ try{ v===null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function nowStr(){
    const d = new Date(), p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  /* ── 기기 저장소 (IndexedDB) ── */
  let _db = null;
  function db(){
    if(_db) return Promise.resolve(_db);
    return new Promise((res, rej) => {
      const to = setTimeout(() => rej(new Error('저장소 응답 없음')), 3000);
      try{
        const r = indexedDB.open('museum_hunt', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('pending');
        r.onsuccess = () => { clearTimeout(to); _db = r.result; res(_db); };
        r.onerror = () => { clearTimeout(to); rej(r.error); };
      }catch(e){ clearTimeout(to); rej(e); }
    });
  }
  async function idb(mode, fn){
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction('pending', mode), st = tx.objectStore('pending');
      const req = fn(st);
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
    });
  }
  const pKey = no => U.sid + '_' + no;
  async function loadPending(){
    P = {};
    try{
      for(const t of T){
        const v = await idb('readonly', st => st.get(pKey(t.no)));
        if(v) P[t.no] = v;
      }
    }catch(e){ idbOK = false; }
    sendMarks();
  }
  /* 저장 사실만 서버에 알림 (사진은 보내지 않음, 1KB 미만) — 실패하면 다음 접속 때 다시 보냄 */
  async function sendMarks(){
    for(const no of Object.keys(P)){
      const p = P[no];
      if(p.marked) continue;
      try{
        await call('markSaved', U.sid, U.name, U.code, no, p.savedAt);
        p.marked = true;
        try{ await idb('readwrite', st => st.put(p, pKey(no))); }catch(e){}
      }catch(e){}
    }
  }
  async function savePending(no, v){ await idb('readwrite', st => st.put(v, pKey(no))); P[no] = v; }
  async function dropPending(no){ try{ await idb('readwrite', st => st.delete(pKey(no))); }catch(e){} delete P[no]; }

  /* ── 로그인 ── */
  async function doLogin(auto){
    const sid = $('sid').value.trim(), name = $('sname').value.trim(), code = $('scode').value.trim();
    if(!sid || !name || !code){ $('loginMsg').className='msg err'; $('loginMsg').textContent='모두 입력해 주세요.'; return; }
    $('btnLogin').disabled = true; $('btnLogin').innerHTML = '<span class="spinner"></span>확인 중';
    $('loginMsg').textContent = '';
    try{
      const r = await call('login', sid, name, code);
      U = { sid: r.user.sid, name: r.user.name, code };
      T = r.treasures; S = r.status || {};
      store('mus_login', JSON.stringify(U));
      await loadPending();
      showMain();
    }catch(e){
      $('loginMsg').className='msg err'; $('loginMsg').textContent = errText(e);
      if(auto) store('mus_login', null);
    }finally{
      $('btnLogin').disabled = false; $('btnLogin').textContent = '입장하기';
    }
  }
  function logout(){
    if(Object.keys(P).length && !confirm('아직 올리지 않은 사진이 있어요.\n같은 학번으로 다시 들어오면 그대로 남아 있어요.\n로그아웃할까요?')) return;
    store('mus_login', null); location.reload();
  }

  /* ── 메인 ── */
  function showMain(){
    $('login').style.display='none'; $('main').style.display='block';
    $('whoName').textContent = U.name; $('whoSid').textContent = U.sid;
    renderGrid();
  }
  function isDone(no){ const s=S[no]; return !!(s && s.answered && s.photo && !P[no]); }

  function onCellular(){
    const c = navigator.connection;
    return !!(c && c.type === 'cellular');
  }

  function sizeMB(nos){
    const bytes = nos.reduce((a, no) => a + ((P[no].data||'').length + (P[no].thumb||'').length) * 0.75, 0);
    return Math.max(0.1, bytes / 1048576).toFixed(1);
  }
  function confirmWifi(nos){
    return new Promise(res => {
      $('dlgSize').innerHTML = `사진 <b>${nos.length}장</b>, 약 <b>${sizeMB(nos)}MB</b>를 올려요.`;
      $('dlgWarn').textContent = onCellular() ? '⚠️ 지금 모바일 데이터에 연결되어 있어요' : '';
      $('dlg').style.display = 'flex';
      const done = v => { $('dlg').style.display = 'none'; $('dlgYes').onclick = $('dlgNo').onclick = null; res(v); };
      $('dlgYes').onclick = () => done(true);
      $('dlgNo').onclick = () => done(false);
    });
  }

  function renderPendingBar(){
    const n = Object.keys(P).length, bar = $('pendBar');
    if(!n){ bar.style.display='none'; return; }
    bar.style.display='block';
    $('pendCnt').textContent = n;
    $('pendWarn').textContent = onCellular() ? '⚠️ 지금 모바일 데이터에 연결되어 있어요' : '데이터가 사용될 수 있으니 와이파이에서 올려 주세요';
    $('btnUpAll').disabled = uploading;
    if(!uploading) $('btnUpAll').textContent = '📶 와이파이 연결 후 모두 올리기';
  }

  function renderGrid(){
    const done = T.filter(t => isDone(t.no)).length;
    $('doneCnt').textContent = done; $('totalCnt').textContent = T.length;
    $('barFill').style.width = (T.length ? done/T.length*100 : 0) + '%';
    renderPendingBar();
    $('grid').innerHTML = T.map(t => {
      const s = S[t.no] || {};
      const photoChip = P[t.no] ? '<span class="chip wait">📦 대기</span>'
                      : `<span class="chip ${s.photo?'on':''}">${s.photo?'✓ ':''}사진</span>`;
      return `<button class="tcard ${isDone(t.no)?'done':''}" onclick="openT('${esc(t.no)}')">
        <span class="stamp">완료</span>
        <div class="img"><img data-no="${esc(t.no)}" alt=""></div>
        <div class="info">
          <div class="name">💎 보물 ${esc(t.no)}</div>
          <div class="loc">📍 ${esc(t.location)}</div>
          <div class="chips">
            <span class="chip ${s.answered?'on':''}">${s.answered?'✓ ':''}이름</span>
            ${photoChip}
          </div>
        </div></button>`;
    }).join('');
    document.querySelectorAll('#grid img[data-no]').forEach(img => setImg(img, img.dataset.no));
  }

  async function setImg(imgEl, no){
    const t = T.find(x => x.no === no); if(!t) return;
    if(imgCache[no]){ imgEl.src = imgCache[no]; return; }
    const src = t.image;
    if(!src){ imgCache[no] = `images/${no}.jpg`; imgEl.src = imgCache[no]; return; }
    if(/^https?:|^data:/.test(src)){ imgCache[no] = src; imgEl.src = src; return; }
    try{ imgCache[no] = await call('getTreasureImage', src); imgEl.src = imgCache[no]; }
    catch(e){ imgEl.src = `images/${no}.jpg`; }
  }

  /* ── 상세 ── */
  function openT(no){
    cur = no;
    const t = T.find(x => x.no === no);
    $('mNo').textContent = t.no;
    $('mImg').src = ''; setImg($('mImg'), no);
    $('mLoc').textContent = t.location;
    $('mHints').innerHTML = t.hints.map((h,i)=>`<div class="hint"><span class="n">${i+1}</span><div>${esc(h)}</div></div>`).join('');
    $('mQ').textContent = t.question;
    $('ansMsg').textContent=''; $('upMsg').textContent=''; $('ansArea').innerHTML='';
    renderDetail();
    $('modal').style.display='block'; $('modal').scrollTop=0;
    document.body.style.overflow='hidden';
  }
  function closeModal(){ $('modal').style.display='none'; document.body.style.overflow=''; cur=null; renderGrid(); }

  function renderDetail(){
    if(cur === null) return;
    const s = S[cur] || {}, p = P[cur];
    if(s.answered){
      $('ansArea').innerHTML = '<div class="solved">✓ 정답! 이름을 맞혔어요</div>';
    }else if(!$('ans')){
      $('ansArea').innerHTML = `<div class="ansrow">
        <input id="ans" class="inp" placeholder="빈칸에 들어갈 말" autocomplete="off" onkeydown="if(event.key==='Enter')submitAns()">
        <button id="btnAns" class="btn-gold" onclick="submitAns()">확인</button></div>`;
    }
    const drop = $('drop'), btn = $('btnUpload'), now = $('btnNow');
    drop.classList.toggle('locked', !s.answered);
    now.style.display = 'none';
    if(!s.answered){
      drop.innerHTML = '<div>🔒 이름을 먼저 맞히면 사진을 저장할 수 있어요</div>';
      btn.disabled = true; btn.textContent = '📷 사진 찍기 / 고르기';
    }else if(p){
      drop.innerHTML = `<img src="${p.data}"><div class="pendNote">📦 이 기기에 저장됨 (${esc(p.savedAt.slice(11,16))}) · 아직 올리지 않았어요</div>`;
      btn.disabled = uploading; btn.textContent = '🔄 다른 사진으로 바꾸기';
      now.style.display = 'block'; now.disabled = uploading;
    }else if(s.photo){
      drop.innerHTML = `<div>✅ 인증 사진 제출 완료<br><small>${esc(s.photoTime||'')}</small></div>`;
      btn.disabled = uploading; btn.textContent = '🔄 사진 다시 찍기';
    }else{
      drop.innerHTML = '<div>📷 이 유물 앞에서 <b>내 얼굴이 함께 나오게</b> 사진을 찍어 주세요<br><small>사진은 먼저 휴대폰에 저장되고, 와이파이에서 한꺼번에 올려요</small></div>';
      btn.disabled = false; btn.textContent = '📷 사진 찍기 / 고르기';
    }
  }

  async function submitAns(){
    const v = ($('ans').value||'').trim();
    if(!v){ $('ansMsg').className='msg err'; $('ansMsg').textContent='답을 입력해 주세요.'; return; }
    const btn = $('btnAns'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try{
      const r = await call('checkAnswer', U.sid, U.name, U.code, cur, v);
      S = r.status || S;
      if(r.ok){ $('ansMsg').className='msg ok'; $('ansMsg').textContent='정답이에요! 이제 인증 사진을 찍어 주세요.'; renderDetail(); }
      else{ $('ansMsg').className='msg err'; $('ansMsg').textContent='아쉬워요. 힌트를 다시 읽어 보세요.'; btn.disabled=false; btn.textContent='확인'; }
    }catch(e){
      $('ansMsg').className='msg err'; $('ansMsg').textContent = errText(e);
      btn.disabled=false; btn.textContent='확인';
    }
  }

  /* ── 사진 ── */
  function pickFile(){ $('file').value=''; $('file').click(); }

  function resize(file, max=1280, q=0.8){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const r = Math.min(1, max / Math.max(w, h));
        w = Math.round(w*r); h = Math.round(h*r);
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 읽을 수 없어요. 다른 사진으로 시도해 주세요.')); };
      img.src = url;
    });
  }

  async function onFile(input){
    const f = input.files && input.files[0]; if(!f) return;
    const no = cur;
    try{
      const data = await resize(f);
      const thumb = await resize(f, 360, 0.75);
      const v = { data, thumb, savedAt: nowStr() };
      if(idbOK){
        try{
          await savePending(no, v);
          sendMarks();
          $('upMsg').className='msg ok'; $('upMsg').textContent='휴대폰에 저장했어요. 와이파이에 연결되면 올려 주세요.';
          renderDetail(); renderPendingBar();
          return;
        }catch(e){ idbOK = false; }
      }
      // 기기 저장이 안 되는 환경 → 바로 업로드
      $('upMsg').className='msg'; $('upMsg').textContent='이 브라우저는 저장이 안 돼서 바로 올릴게요.';
      P[no] = v;
      await uploadOne(no);
    }catch(e){
      $('upMsg').className='msg err'; $('upMsg').textContent = errText(e);
    }
  }

  async function uploadOne(no){
    const p = P[no]; if(!p) return;
    const r = await call('uploadPhoto', U.sid, U.name, U.code, no, p.data, p.thumb, p.savedAt);
    S = r.status || S;
    await dropPending(no);
  }

  async function uploadNow(){
    const no = cur;
    if(!P[no] || !(await confirmWifi([no]))) return;
    uploading = true; renderDetail();
    $('btnNow').innerHTML = '<span class="spinner"></span>올리는 중…';
    $('upMsg').className='msg'; $('upMsg').textContent='';
    try{
      await uploadOne(no);
      $('upMsg').className='msg ok'; $('upMsg').textContent='인증 완료! 🎉';
      if(isDone(no)) toast(`보물 ${no} 완료!`);
    }catch(e){
      $('upMsg').className='msg err'; $('upMsg').textContent = errText(e) + ' (다시 시도해 주세요)';
    }finally{
      uploading = false; $('btnNow').textContent = '⬆️ 이 사진 지금 올리기';
      renderDetail(); renderPendingBar();
    }
  }

  async function uploadAll(){
    const list = Object.keys(P);
    if(!list.length) return;
    if(!(await confirmWifi(list))) return;
    uploading = true; renderPendingBar();
    let ok = 0, fail = 0;
    for(let i = 0; i < list.length; i++){
      $('btnUpAll').innerHTML = `<span class="spinner"></span>올리는 중… (${i+1}/${list.length})`;
      try{ await uploadOne(list[i]); ok++; }catch(e){ fail++; }
    }
    uploading = false;
    renderGrid();
    toast(fail ? `${ok}장 완료, ${fail}장 실패 — 다시 눌러 주세요` : `${ok}장 모두 올렸어요! 🎉`);
  }

  /* 자동 로그인 */
  (function(){
    const saved = load('mus_login');
    if(!saved) return;
    try{
      const u = JSON.parse(saved);
      $('sid').value=u.sid; $('sname').value=u.name; $('scode').value=u.code;
      doLogin(true);
    }catch(e){}
  })();
</script>
